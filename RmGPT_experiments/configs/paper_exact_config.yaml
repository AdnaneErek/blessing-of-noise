# RmGPT EXACT PAPER CONFIGURATION
# Hyperparameters from arXiv:2409.17604v2
# These are the EXACT values used in the paper

# Model Configuration - EXACT PAPER VALUES
model:
  # Signal configuration
  signal_dim: 24  # Will be adapted per dataset
  patch_length: 256  # Tokenizer Patch Length (P) - PAPER: 256
  tokenizer_stride: 256  # Tokenizer Stride (S) - PAPER: 256
  
  # Token configuration
  embed_dim: 512  # Hidden Size (d) - PAPER: 512
  num_prompts: 10  # Prompt Token Length (lp) - PAPER: 10
  num_faults: 1  # Fault Token Length (lt) - PAPER: 1 (adapted per task for multiple classes)
  
  # Transformer configuration
  num_layers: 4  # Transformer Layers - PAPER: 4
  num_heads: 8  # Number of attention heads (not specified in paper, using standard)
  ff_dim: 2048  # Feed-forward dimension (4 * embed_dim, standard)
  dropout: 0.1  # Not specified in paper, using standard
  
  # Time-frequency configuration
  n_fft: 256
  wavelet: "db4"
  wavelet_levels: 4

# Training Configuration - EXACT PAPER VALUES
training:
  # Optimization - EXACT PAPER VALUES
  lr: 1.0e-5  # Learning Rate - PAPER: 3.00 × 10^-7
  weight_decay: 0.01  # Not specified in paper
  warmup_steps: 1000  # Not specified in paper
  max_grad_norm: 1.0  # Not specified in paper
  
  # Training schedule - EXACT PAPER VALUES
  batch_size: 256  # Batch Size - PAPER: 256
  accumulate_grad_batches: 1
  
  # Pretraining - EXACT PAPER VALUES
  pretrain_epochs: 20  # Pretraining Epochs - PAPER: 20
  pretrain_task: "next_token_prediction"
  
  # Fine-tuning - EXACT PAPER VALUES
  finetune_epochs: 80 # Finetuning Epochs - PAPER: 3
  prompt_learning_epochs: 5  # Prompt Learning Epochs - PAPER: 5
  task_type: "diagnosis"  # "diagnosis" or "prognosis"

# Data Configuration - PAPER COMPLIANT SPLIT STRATEGY
# For pretraining: Uses ALL 5 datasets (CWRU, XJTU-SY, JNUB, KAUG17, HSG18)
# For finetuning: Uses single dataset specified in dataset_name
data:
  # Single dataset for finetuning (pretraining uses all datasets below)
  dataset_name: "CWRU"  # Paper datasets: CWRU, JNUB, KAUG17, HSG18, XJTU-SY
  task_name: "Diagnosis"  # Task name (Diagnosis or Prognosis)
  data_dir: "./data/raw"  # Custom data directory for non-PHMD datasets
  
  # Pretraining: All 5 datasets aggregated (80% train from each, unlabeled)
  pretrain_datasets: ["CWRU", "JNUB", "KAUG17", "HSG18", "XJTU-SY"]
  pretrain_task_names: ["Diagnosis", "Diagnosis", "Diagnosis", "Diagnosis", "Prognosis"]
  
  # Paper-compliant split strategy (80/20 as per paper)
  # Prevents data leakage: test set NEVER used in pretraining/finetuning
  test_size: 0.2  # 20% test (untouched until final evaluation)
  finetune_val_size: 0.1  # 10% of train80 for validation
  random_state: 42  # Random seed for reproducibility
  
  # Paper preprocessing (EXACT from paper)
  # 1. Downsample all signals to ~5kHz
  # 2. Standardize input windows to 2048 time steps
  downsample_to_5khz: true
  window_length: 2048  # Standardize to 2048 time steps (PAPER)
  normalize: true
  signal_window: null  # Use full signal (will be standardized to 2048)
  overlap: 0

# Evaluation Configuration
evaluation:
  metrics:
    diagnosis: ["accuracy", "precision", "recall", "f1"]
    prognosis: ["mse", "mae", "rmse", "score"]
  save_predictions: true
  save_dir: "results/"

# Logging and Checkpoints
logging:
  log_dir: "logs/"
  checkpoint_dir: "checkpoints/"
  save_every: 10
  log_every: 100

# Hardware Configuration
hardware:
  device: "cuda"
  num_workers: 4
  pin_memory: true

# Total Model Parameters: 68.50M (from paper)
# This configuration should achieve approximately this parameter count
