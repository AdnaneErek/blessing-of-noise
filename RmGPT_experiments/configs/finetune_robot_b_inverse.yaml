# Robot-B Inverse Fine-tuning Configuration
# Train on Robot-B small set (testDatasets/20241016), evaluate on Robot-A finetuning datasets.

model:
  signal_dim: 9
  patch_length: 256
  tokenizer_stride: 256

  embed_dim: 512
  num_prompts: 10
  num_faults: 9

  num_layers: 4
  num_heads: 8
  ff_dim: 2048
  dropout: 0.1
  improved_diagnosis_head: true

  n_fft: 256
  wavelet: "db4"
  wavelet_levels: 4

training:
  # Conservative few-shot adaptation (Robot-B has only ~10/class)
  lr: 1.0e-6
  head_lr: 2.0e-5
  weight_decay: 0.01
  warmup_steps: 10
  max_grad_norm: 1.0

  label_smoothing: 0.1
  use_focal_loss: false
  focal_alpha: 0.25
  focal_gamma: 2.0

  lr_schedule: "cosine"
  min_lr: 1.0e-7

  batch_size: 16
  accumulate_grad_batches: 1

  finetune_epochs: 30
  prompt_learning_epochs: 5
  task_type: "diagnosis"

  # Keep most of backbone fixed to reduce overfitting in low-data regime
  freeze_backbone: true
  unfreeze_percentage: 0.5

data:
  dataset_name: "ROBOT_B_INVERSE"
  task_name: "diagnosis"
  data_dir: "data/raw/dataset"

  # Train source: Robot-B subset inside testDatasets
  robot_b_train_folder: "20241016"
  finetune_val_size: 0.2
  random_state: 42

  normalize: true
  signal_window: 1000
  overlap: 0

  # Eval target: Robot-A folders in finetuningDatasets
  robot_a_eval_folders: null

logging:
  log_dir: "logs/robot_b_inverse"
  checkpoint_dir: "checkpoints/robot_b_inverse"
  save_every: 5

evaluation:
  save_dir: "results/robot_b_inverse"

hardware:
  device: "cuda"
  num_workers: 4
  pin_memory: true
