# Supervised Pretraining Configuration
# Train RmGPT (backbone + head) on robot simulation data with classification labels
# This learns class-discriminative features from simulation data

# Model Configuration
model:
  signal_dim: 9  # Use actual input channels (no projection needed)
  patch_length: 256
  tokenizer_stride: 256
  
  embed_dim: 512
  num_prompts: 10
  num_faults: 9  # 9 classes for robot dataset
  
  num_layers: 4
  num_heads: 8
  ff_dim: 2048
  dropout: 0.1
  improved_diagnosis_head: true  # Use improved (deeper) diagnosis head
  
  n_fft: 256
  wavelet: "db4"
  wavelet_levels: 4

# Training Configuration - Supervised Pretraining
training:
  lr: 1.0e-4  # Standard LR for training from scratch
  head_lr: null  # Use same LR for all parameters (or set higher for head)
  weight_decay: 0.01
  warmup_steps: 100
  max_grad_norm: 1.0
  
  # Loss function improvements
  label_smoothing: 0.1  # Prevents overconfidence, improves generalization
  use_focal_loss: true  # Handles class imbalance better
  focal_alpha: 0.25  # Focal loss alpha (class weighting)
  focal_gamma: 2.0  # Focal loss gamma (focusing parameter)
  
  # Learning rate schedule
  lr_schedule: "constant"  # or "cosine" for decay
  min_lr: 1.0e-6
  
  # Training schedule
  batch_size: 256
  accumulate_grad_batches: 1
  
  # Pretraining epochs
  pretrain_epochs: 100  # Train for 100 epochs on simulation data

# Data Configuration - Robot Simulation Dataset
data:
  dataset_name: "ROBOT"  # Custom dataset name
  task_name: "diagnosis"
  data_dir: "data/raw/dataset"  # Path to the robot dataset
  robot_training_folder: null  # If None, auto-discovers all folders
  use_individual_files: true
  
  # Data processing
  normalize: true
  signal_window: 1000
  overlap: 0
  test_size: 0.2
  finetune_val_size: 0.1
  random_state: 42
  
  # Optional: Noise augmentation for domain adaptation
  noise_augmentation:
    enabled: false  # Disable for supervised pretraining (can enable if needed)
    std: 0.05
    type: "gaussian"

# Logging and Checkpointing
logging:
  log_dir: "logs"
  checkpoint_dir: "checkpoints"
  save_every: 10  # Save checkpoint every 10 epochs

# Evaluation
evaluation:
  save_dir: "results"

# Hardware Configuration
hardware:
  device: "cuda"
  num_workers: 4
  pin_memory: true
