# Robot Dataset Fine-tuning Configuration - REAL DATA (IMPROVED V3)
# Fine-tune a model trained on simulation data using real robot data
# Strategy: Progressive unfreezing with mixed training data

# Model Configuration (should match the simulation-trained model)
model:
  signal_dim: 9  # Use actual input channels (no projection needed)
  patch_length: 256
  tokenizer_stride: 256
  
  embed_dim: 512
  num_prompts: 10
  num_faults: 9  # 9 classes for robot dataset
  
  num_layers: 4
  num_heads: 8
  ff_dim: 2048
  dropout: 0.1
  improved_diagnosis_head: true  # Use improved (deeper) diagnosis head
  
  n_fft: 256
  wavelet: "db4"
  wavelet_levels: 4

# Training Configuration - FINE-TUNING ON REAL DATA (IMPROVED V3)
# Strategy: Progressive unfreezing + lower LRs to preserve simulation knowledge
training:
  # Even lower learning rates to minimize forgetting
  lr: 5.0e-7  # Very low LR for backbone (20x lower than before)
  head_lr: 5.0e-6  # Lower LR for head (10x lower than before)
  weight_decay: 0.01
  warmup_steps: 10  # Shorter warmup for fine-tuning
  max_grad_norm: 1.0
  
  # Loss function improvements
  label_smoothing: 0.1  # Prevents overconfidence, improves generalization
  use_focal_loss: true  # Handles class imbalance better
  focal_alpha: 0.25  # Focal loss alpha (class weighting)
  focal_gamma: 2.0  # Focal loss gamma (focusing parameter)
  
  # Learning rate schedule - use cosine decay for gradual adaptation
  lr_schedule: "cosine"  # Cosine decay instead of constant
  min_lr: 1.0e-8  # Minimum LR for cosine decay
  
  # Training schedule
  batch_size: 32  # Smaller batch size (limited real data)
  accumulate_grad_batches: 1
  
  # Fine-tuning - fewer epochs with very low LR
  finetune_epochs: 20  # Fewer epochs to prevent overfitting
  prompt_learning_epochs: 5
  task_type: "diagnosis"
  
  # Progressive unfreezing - unfreeze last 50% of layers (2 out of 4)
  freeze_backbone: True  # Enable progressive unfreezing
  unfreeze_percentage: 0.5  # Unfreeze last 50% (2 layers) instead of 25% (1 layer)

# Data Configuration - Real Robot Fine-tuning Data
data:
  dataset_name: "ROBOT_REAL"  # Custom dataset name for real data
  task_name: "diagnosis"
  data_dir: "data/raw/dataset"  # Path to the robot dataset
  finetuning_folder: null  # If None, auto-discovers all folders in finetuningDatasets
  normalize: true
  signal_window: 1000 # Robot data is 1000 timesteps
  overlap: 0 # No overlap for now
  finetune_val_size: 0.1  # 10% of real data for validation
  random_state: 42
  
  # No noise augmentation for real data (it's already real!)

# Logging and Checkpointing
logging:
  log_dir: "logs"
  checkpoint_dir: "checkpoints"
  save_every: 5  # Save checkpoint every 5 epochs

# Evaluation
evaluation:
  save_dir: "results"

# Hardware Configuration
hardware:
  device: "cuda"
  num_workers: 4
  pin_memory: true
