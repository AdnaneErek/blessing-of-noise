# Supervised Pretraining Configuration (V2 - transfer-focused)
# Goal: improve sim->real transfer by reducing late-epoch overfitting.

# Model Configuration
model:
  signal_dim: 9
  patch_length: 256
  tokenizer_stride: 256

  embed_dim: 512
  num_prompts: 10
  num_faults: 9

  num_layers: 4
  num_heads: 8
  ff_dim: 2048
  dropout: 0.1
  improved_diagnosis_head: true

  n_fft: 256
  wavelet: "db4"
  wavelet_levels: 4

# Training Configuration
training:
  # Slightly lower LR + cosine decay to avoid overfitting after early good epochs.
  lr: 8.0e-5
  # Keep a moderately higher LR for head adaptation.
  head_lr: 2.0e-4
  weight_decay: 0.01
  warmup_steps: 200
  max_grad_norm: 1.0

  # Balanced classes: focal loss is usually not needed and can over-focus hard samples.
  label_smoothing: 0.05
  use_focal_loss: false
  focal_alpha: 0.25
  focal_gamma: 2.0

  # Smooth decay tends to preserve transfer better than constant LR late in training.
  lr_schedule: "cosine"
  min_lr: 1.0e-6

  batch_size: 256
  accumulate_grad_batches: 1

  # Extended training window; select best checkpoint by real-test transfer.
  pretrain_epochs: 80
  early_stopping:
    enabled: true
    patience: 12
    min_delta: 0.001

# Data Configuration - Robot Simulation Dataset
data:
  dataset_name: "ROBOT"
  task_name: "diagnosis"
  data_dir: "data/raw/dataset"
  robot_training_folder: null
  use_individual_files: true

  normalize: true
  signal_window: 1000
  overlap: 0
  test_size: 0.2
  finetune_val_size: 0.1
  random_state: 42

  # Very mild noise can regularize while avoiding the degradation seen with larger noise.
  noise_augmentation:
    enabled: true
    std: 0.01
    type: "gaussian"

# Logging and Checkpointing
logging:
  log_dir: "logs"
  checkpoint_dir: "checkpoints"
  save_every: 5

# Evaluation
evaluation:
  save_dir: "results"

# Hardware Configuration
hardware:
  device: "cuda"
  # Keep workers within system recommendation to avoid loader warnings.
  num_workers: 4
  pin_memory: true
