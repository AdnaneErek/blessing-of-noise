# Improved Fine-tuning Configuration
# Optimized for better convergence and higher accuracy

# Model Configuration - Same as paper
model:
  signal_dim: 24  # Will be adapted per dataset
  patch_length: 256
  tokenizer_stride: 256
  
  embed_dim: 512
  num_prompts: 10
  num_faults: 1  # Will be adapted per task
  
  num_layers: 4
  num_heads: 8
  ff_dim: 2048
  dropout: 0.2  # Increased from 0.1 to reduce overfitting
  
  n_fft: 256
  wavelet: "db4"
  wavelet_levels: 4

# Training Configuration - OPTIMIZED FOR FINE-TUNING
training:
  # Optimization - INCREASED FOR FINE-TUNING
  lr: 1.0e-3  # Increased further (was 5e-4) for faster convergence
  weight_decay: 0.01  # Reduced back to 0.01 (less regularization for better learning)
  warmup_steps: 100  # Slightly increased warmup for stability
  max_grad_norm: 1.0
  
  # Learning rate schedule - SLOWER DECAY for more epochs
  lr_schedule: "cosine"  # Options: "cosine", "linear", "constant"
  min_lr: 1.0e-5  # Higher minimum LR (was 1e-6) to keep learning longer
  
  # Training schedule
  batch_size: 256
  accumulate_grad_batches: 1
  
  # Fine-tuning - SIGNIFICANTLY INCREASED EPOCHS (user requested more epochs)
  finetune_epochs: 80  # Increased from 30 to 80 for better convergence
  prompt_learning_epochs: 5
  task_type: "diagnosis"

# Data Configuration - Same as paper
data:
  dataset_name: "CWRU"
  task_name: "Diagnosis"
  data_dir: "./data/raw"
  
  pretrain_datasets: ["CWRU", "JNUB", "KAUG17", "HSG18", "XJTU-SY"]
  pretrain_task_names: ["Diagnosis", "Diagnosis", "Diagnosis", "Diagnosis", "Prognosis"]
  
  test_size: 0.2
  finetune_val_size: 0.1
  random_state: 42
  
  downsample_to_5khz: true
  window_length: 2048
  normalize: true
  signal_window: null
  overlap: 0

# Evaluation Configuration
evaluation:
  metrics:
    diagnosis: ["accuracy", "precision", "recall", "f1"]
    prognosis: ["mse", "mae", "rmse", "score"]
  save_predictions: true
  save_dir: "results/"

# Logging and Checkpoints
logging:
  log_dir: "logs/"
  checkpoint_dir: "checkpoints/"
  save_every: 5  # Save more frequently
  log_every: 50  # Log more frequently

# Hardware Configuration
hardware:
  device: "cuda"
  num_workers: 4
  pin_memory: true
