# Robot Dataset Fine-tuning Configuration - REAL DATA (Improved)
# Fine-tune a model trained on simulation data using real robot data
# IMPROVED VERSION: Much lower learning rates to prevent catastrophic forgetting

# Model Configuration (should match the simulation-trained model)
model:
  signal_dim: 9  # Use actual input channels (no projection needed)
  patch_length: 256
  tokenizer_stride: 256
  
  embed_dim: 512
  num_prompts: 10
  num_faults: 9  # 9 classes for robot dataset
  
  num_layers: 4
  num_heads: 8
  ff_dim: 2048
  dropout: 0.1
  improved_diagnosis_head: true  # Use improved (deeper) diagnosis head
  
  n_fft: 256
  wavelet: "db4"
  wavelet_levels: 4

# Training Configuration - FINE-TUNING ON REAL DATA (IMPROVED)
# Use MUCH LOWER learning rates to prevent catastrophic forgetting
training:
  # Much lower learning rates (10-100x reduction from v1)
  lr: 1.0e-6  # Very low LR for backbone (10x lower than v1, preserves sim features)
  head_lr: 1.0e-5  # Lower LR for head (50x lower than v1, prevents overfitting)
  weight_decay: 0.01
  warmup_steps: 20  # Shorter warmup for fine-tuning
  max_grad_norm: 1.0
  
  # Loss function improvements
  label_smoothing: 0.1  # Prevents overconfidence, improves generalization
  use_focal_loss: true  # Handles class imbalance better (Healthy has more samples)
  focal_alpha: 0.25  # Focal loss alpha (class weighting)
  focal_gamma: 2.0  # Focal loss gamma (focusing parameter)
  
  # Learning rate schedule - use cosine decay for gradual adaptation
  lr_schedule: "cosine"  # Cosine decay instead of constant
  min_lr: 1.0e-7  # Minimum LR for cosine decay
  
  # Training schedule
  batch_size: 32  # Smaller batch size (limited real data: ~190 samples)
  accumulate_grad_batches: 1
  
  # Fine-tuning - fewer epochs with early stopping
  finetune_epochs: 30  # More epochs but with cosine decay
  prompt_learning_epochs: 5
  task_type: "diagnosis"
  
  # Freeze backbone option (set to true to only fine-tune head)
  freeze_backbone: false  # Set to true to freeze backbone, only train head

# Data Configuration - Real Robot Fine-tuning Data
data:
  dataset_name: "ROBOT_REAL"  # Custom dataset name for real data
  task_name: "diagnosis"
  data_dir: "data/raw/dataset"  # Path to the robot dataset
  finetuning_folder: null  # If None, auto-discovers all folders in finetuningDatasets
  normalize: true
  signal_window: 1000 # Robot data is 1000 timesteps
  overlap: 0 # No overlap for now
  finetune_val_size: 0.1  # 10% of real data for validation (for early stopping)
  random_state: 42
  
  # No noise augmentation for real data (it's already real!)

# Logging and Checkpointing
logging:
  log_dir: "logs"
  checkpoint_dir: "checkpoints"
  save_every: 5  # Save checkpoint every 5 epochs (more frequent for fine-tuning)

# Evaluation
evaluation:
  save_dir: "results"

# Hardware Configuration
hardware:
  device: "cuda"
  num_workers: 4
  pin_memory: true
