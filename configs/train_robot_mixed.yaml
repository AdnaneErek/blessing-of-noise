# Robot Dataset Training Configuration - MIXED (Simulation + Real)
# Train on a mix of simulation and real data to bridge domain gap
# This prevents catastrophic forgetting while adapting to real data

# Model Configuration
model:
  signal_dim: 9  # Use actual input channels (no projection needed)
  patch_length: 256
  tokenizer_stride: 256
  
  embed_dim: 512
  num_prompts: 10
  num_faults: 9  # 9 classes for robot dataset
  
  num_layers: 4
  num_heads: 8
  ff_dim: 2048
  dropout: 0.1
  improved_diagnosis_head: true  # Use improved (deeper) diagnosis head
  
  n_fft: 256
  wavelet: "db4"
  wavelet_levels: 4

# Training Configuration - MIXED DATA
training:
  # Learning rates for mixed training
  lr: 1.0e-4  # Standard LR for training from scratch
  head_lr: null  # Use same LR for all parameters
  weight_decay: 0.01
  warmup_steps: 100
  max_grad_norm: 1.0
  
  # Loss function improvements
  label_smoothing: 0.1  # Prevents overconfidence, improves generalization
  use_focal_loss: true  # Handles class imbalance better
  focal_alpha: 0.25  # Focal loss alpha (class weighting)
  focal_gamma: 2.0  # Focal loss gamma (focusing parameter)
  
  # Learning rate schedule
  lr_schedule: "constant"
  min_lr: 1.0e-6
  
  # Training schedule
  batch_size: 256
  accumulate_grad_batches: 1
  
  # Training epochs
  finetune_epochs: 100  # Standard training epochs
  prompt_learning_epochs: 5
  task_type: "diagnosis"

# Data Configuration - MIXED (Simulation + Real)
data:
  dataset_name: "ROBOT_MIXED"  # Custom dataset name
  task_name: "diagnosis"
  data_dir: "data/raw/dataset"  # Path to the robot dataset
  
  # Simulation data (from trainingDatasets)
  robot_training_folder: null  # If None, auto-discovers all folders
  
  # Real data (from finetuningDatasets)
  use_real_data: true  # Enable mixing real data
  real_data_ratio: 0.2  # 20% real data, 80% simulation (adjustable)
  finetuning_folder: null  # If None, auto-discovers all folders in finetuningDatasets
  
  # Data processing
  normalize: true
  signal_window: 1000 # Robot data is 1000 timesteps
  overlap: 0 # No overlap for now
  
  # Splitting strategy
  test_size: 0.2  # 20% test (from simulation data only)
  finetune_val_size: 0.1  # 10% of train80 for validation
  random_state: 42
  
  # IMPORTANT: Real test dataset (testDatasets/) is NOT used in training

# Logging and Checkpointing
logging:
  log_dir: "logs"
  checkpoint_dir: "checkpoints"
  save_every: 10 # Save checkpoint every 10 epochs

# Evaluation
evaluation:
  save_dir: "results"

# Hardware Configuration
hardware:
  device: "cuda"
  num_workers: 4
  pin_memory: true
