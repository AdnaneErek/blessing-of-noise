# Multitask Pretraining (Supervised Classification + Masked Token Prediction)
# New config kept separate from existing flows.

model:
  signal_dim: 9
  patch_length: 256
  tokenizer_stride: 256

  embed_dim: 512
  num_prompts: 10
  num_faults: 9

  num_layers: 4
  num_heads: 8
  ff_dim: 2048
  dropout: 0.1
  improved_diagnosis_head: true

  n_fft: 256
  wavelet: "db4"
  wavelet_levels: 4

training:
  # Optimization
  lr: 8.0e-5
  head_lr: 2.0e-4
  weight_decay: 0.01
  warmup_steps: 200
  max_grad_norm: 1.0

  # Losses (classification branch)
  label_smoothing: 0.05
  use_focal_loss: false
  focal_alpha: 0.25
  focal_gamma: 2.0

  # Schedule
  lr_schedule: "cosine"
  min_lr: 1.0e-6

  # Batching
  batch_size: 256
  accumulate_grad_batches: 1

  # Epochs
  pretrain_epochs: 60

  # Multitask settings (masked token branch)
  multitask:
    enabled: true
    lambda_cls: 1.0    # For reference/logging (current implementation alternates updates)
    lambda_mask: 0.5   # For reference/logging (see note above)
    mask_prob: 0.2
    mask_every_k_steps: 1   # Alternate: run masked step every k classification steps
    span_mask:
      enabled: true
      avg_span: 24
    channel_drop:
      prob: 0.1

data:
  dataset_name: "ROBOT"
  task_name: "diagnosis"
  data_dir: "data/raw/dataset"
  robot_training_folder: null
  use_individual_files: true

  normalize: true
  signal_window: 1000
  overlap: 0
  test_size: 0.2
  finetune_val_size: 0.1
  random_state: 42

  noise_augmentation:
    enabled: true
    std: 0.01
    type: "gaussian"
  # Increase effective samples by overlapping windows (sim-only)
  # This densifies training while keeping eval clean.
  overlap: 500

logging:
  log_dir: "logs"
  checkpoint_dir: "checkpoints"
  save_every: 5

evaluation:
  save_dir: "results"

hardware:
  device: "cuda"
  num_workers: 4
  pin_memory: true
