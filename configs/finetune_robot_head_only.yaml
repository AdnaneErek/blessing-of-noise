# Robot Dataset Fine-tuning Configuration - HEAD ONLY (Frozen Backbone)
# Fine-tune ONLY the classification head on real robot data
# The backbone is frozen (pretrained on simulation via next-token prediction)

# Model Configuration (should match pretrained model)
model:
  signal_dim: 9
  patch_length: 256
  tokenizer_stride: 256
  
  embed_dim: 512
  num_prompts: 10
  num_faults: 9  # 9 classes for robot dataset
  
  num_layers: 4
  num_heads: 8
  ff_dim: 2048
  dropout: 0.1
  improved_diagnosis_head: true  # Use improved (deeper) diagnosis head
  
  n_fft: 256
  wavelet: "db4"
  wavelet_levels: 4

# Training Configuration - HEAD ONLY (Frozen Backbone)
training:
  # Only head is trained, so we use a single LR
  lr: 1.0e-4  # Learning rate for head (backbone is frozen)
  head_lr: null  # Not used when backbone is frozen
  weight_decay: 0.01
  warmup_steps: 50  # Shorter warmup for head-only training
  max_grad_norm: 1.0
  
  # Loss function
  label_smoothing: 0.1
  use_focal_loss: true
  focal_alpha: 0.25
  focal_gamma: 2.0
  
  # Learning rate schedule
  lr_schedule: "cosine"  # Cosine decay
  min_lr: 1.0e-6
  
  # Training schedule
  batch_size: 32  # Smaller batch for real data
  accumulate_grad_batches: 1
  
  # Fine-tuning epochs
  finetune_epochs: 50  # Train head for 50 epochs
  freeze_backbone: true  # CRITICAL: Freeze backbone, only train head
  unfreeze_percentage: 0.25  # Unfreeze last 25% of transformer layers (1 out of 4 layers)

# Data Configuration - Real Robot Data Only
data:
  dataset_name: "ROBOT_FINETUNE"  # Real robot data for fine-tuning
  task_name: "diagnosis"
  data_dir: "data/raw/dataset"  # Path to the robot dataset
  finetuning_folder: null  # If None, auto-discovers all folders in finetuningDatasets
  normalize: true
  signal_window: 1000
  overlap: 0
  finetune_val_size: 0.1  # 10% validation split
  random_state: 42

# Logging and Checkpointing
logging:
  log_dir: "logs"
  checkpoint_dir: "checkpoints"
  save_every: 10

# Evaluation
evaluation:
  save_dir: "results"

# Hardware Configuration
hardware:
  device: "cuda"
  num_workers: 4
  pin_memory: true
