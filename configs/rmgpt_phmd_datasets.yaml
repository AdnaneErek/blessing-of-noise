# RmGPT Alternative Datasets Configuration
# Using PHMD datasets similar to paper datasets with sampling frequency >5kHz

# Diagnosis Datasets (Fault Classification)
# Replacing: SLIET (bearing), QPZZ-II (gear), SMU (gear)
# With PHMD alternatives:

diagnosis_datasets:
  # Bearing dataset (replaces SLIET)
  - name: "JNUB"
    task: "Diagnosis"
    description: "Jiangnan University Bearing Dataset"
    sampling_frequency: "50 kHz"
    application: "Bearing"
    fault_types: 4  # health state, inner ring, outer ring, rolling element
    available_in_phmd: true
    similar_to: "SLIET"
    
  # Gear dataset 1 (replaces QPZZ-II)
  - name: "KAUG17"
    task: "Diagnosis"
    description: "Korea Aerospace University Gear Dataset"
    sampling_frequency: "10 kHz"
    application: "Gear"
    fault_types: 3  # normal, spall, crack
    available_in_phmd: true
    similar_to: "QPZZ-II"
    
  # Gear dataset 2 (replaces SMU)
  - name: "HSG18"
    task: "Detection"  # Note: This is detection (binary), but can be adapted
    description: "SDOL Wind Generator Gear Dataset"
    sampling_frequency: "97,656 Hz"
    application: "Gear"
    fault_types: 2  # normal, fault (binary classification)
    available_in_phmd: true
    similar_to: "SMU"

# Original paper datasets (kept)
original_datasets:
  - name: "CWRU"
    task: "Diagnosis"
    sampling_frequency: "12 kHz"
    application: "Bearing"
    
  - name: "XJTU-SY"
    task: "Prognosis"
    application: "Bearing"


hardware:
  device: cuda
  num_workers: 4
  pin_memory: true

logging:
  checkpoint_dir: checkpoints/rmgpt_phmd
  log_dir: logs/rmgpt_phmd
  save_every: 1
  log_every: 10

evaluation:
  save_dir: results/rmgpt_phmd
  save_predictions: true
  metrics:
    diagnosis: ["accuracy", "precision", "recall", "f1"]
    prognosis: ["mse", "mae", "rmse", "score"]  


# Usage:
# For diagnosis with JNUB: python train_rmgpt.py --config configs/default_config.yaml --task diagnosis
# Update config: dataset_name: "JNUB" (or "KAUG17", "HSG18")
