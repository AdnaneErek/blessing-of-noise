# Robot Dataset Pretraining Configuration - SIMULATION DATA
# Pretrain RmGPT on simulation data using masked token prediction (BERT-style)
# This learns discriminative signal patterns from simulation, then head will be trained on real data

# Model Configuration
model:
  signal_dim: 9  # Use actual input channels (no projection needed)
  patch_length: 256
  tokenizer_stride: 256
  
  embed_dim: 512
  num_prompts: 10
  num_faults: 1  # Not used in pretraining (no classification head)
  
  num_layers: 4
  num_heads: 8
  ff_dim: 2048
  dropout: 0.1
  
  n_fft: 256
  wavelet: "db4"
  wavelet_levels: 4

# Training Configuration - PRETRAINING (Masked Token Prediction - BERT-style)
training:
  # Learning rate for pretraining
  lr: 1.0e-4  # Standard LR for pretraining from scratch
  weight_decay: 0.01
  warmup_steps: 1000
  max_grad_norm: 1.0
  
  # Learning rate schedule
  lr_schedule: "cosine"  # Cosine decay for pretraining
  min_lr: 1.0e-6
  
  # Training schedule
  batch_size: 256
  accumulate_grad_batches: 1
  
  # Pretraining epochs
  pretrain_epochs: 50  # Pretrain for 50 epochs on simulation data
  pretrain_task: "masked_token_prediction"  # BERT-style masked token prediction
  mask_prob: 0.15  # Mask 15% of signal tokens (BERT standard)

# Data Configuration - Simulation Data Only
data:
  dataset_name: "ROBOT"  # Robot dataset (simulation)
  task_name: "diagnosis"  # Not used in pretraining, but needed for loading
  data_dir: "data/raw/dataset"  # Path to the robot dataset
  robot_training_folder: null  # If None, auto-discovers all folders
  normalize: true
  signal_window: 1000 # Robot data is 1000 timesteps
  overlap: 0 # No overlap for now
  test_size: 0.2  # 20% test (not used in pretraining, but needed for split)
  finetune_val_size: 0.1  # 10% for validation during pretraining
  random_state: 42
  
  # No noise augmentation for pretraining (clean signals)

# Logging and Checkpointing
logging:
  log_dir: "logs"
  checkpoint_dir: "checkpoints"
  save_every: 10 # Save checkpoint every 10 epochs

# Evaluation
evaluation:
  save_dir: "results"

# Hardware Configuration
hardware:
  device: "cuda"
  num_workers: 4
  pin_memory: true
