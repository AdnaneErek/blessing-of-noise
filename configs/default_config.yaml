# RmGPT Default Configuration
# Based on the paper: "RmGPT: A Foundation Model with Generative Pre-trained Transformer 
# for Fault Diagnosis and Prognosis in Rotating Machinery"

# Model Configuration - EXACT PAPER HYPERPARAMETERS
# From arXiv:2409.17604v2
model:
  # Signal configuration
  signal_dim: 24  # Number of sensor channels (will be adapted per dataset)
  patch_length: 256  # Tokenizer Patch Length (P) - PAPER: 256
  tokenizer_stride: 256  # Tokenizer Stride (S) - PAPER: 256
  
  # Token configuration
  embed_dim: 512  # Hidden Size (d) - PAPER: 512
  num_prompts: 10  # Prompt Token Length (lp) - PAPER: 10
  num_faults: 1  # Fault Token Length (lt) - PAPER: 1 (will be adapted per task for multiple fault types)
  
  # Transformer configuration
  num_layers: 4  # Transformer Layers - PAPER: 4
  num_heads: 8  # Number of attention heads
  ff_dim: 2048  # Feed-forward dimension (typically 4 * embed_dim)
  dropout: 0.1
  
  # Time-frequency configuration
  n_fft: 256  # FFT window size
  wavelet: "db4"  # Wavelet type
  wavelet_levels: 4  # Wavelet decomposition levels

# Training Configuration - EXACT PAPER HYPERPARAMETERS
# From arXiv:2409.17604v2
training:
  # Optimization
  lr: 3.0e-7  # Learning Rate - PAPER: 3.00 × 10^-7
  weight_decay: 0.01  # Weight decay
  warmup_steps: 1000  # Warmup steps for learning rate
  max_grad_norm: 1.0  # Gradient clipping
  
  # Training schedule
  batch_size: 256  # Batch Size - PAPER: 256
  accumulate_grad_batches: 1  # Gradient accumulation
  
  # Pretraining
  pretrain_epochs: 20  # Pretraining Epochs - PAPER: 20
  pretrain_task: "next_token_prediction"  # Self-supervised pretraining task
  
  # Fine-tuning
  finetune_epochs: 50  # Finetuning Epochs - PAPER: 3
  prompt_learning_epochs: 5  # Prompt Learning Epochs - PAPER: 5
  task_type: "diagnosis"  # "diagnosis" or "prognosis"

# Data Configuration
# Paper datasets: CWRU, SLIET, QPZZ-II, SMU (diagnosis), XJTU-SY (prognosis)
# PHMD alternatives: JNUB (50kHz), KAUG17 (10kHz), HSG18 (97kHz) - all >5kHz
data:
  dataset_name: "CWRU"  # Options: CWRU, JNUB, KAUG17, HSG18, XJTU-SY
  task_name: "Diagnosis"  # Task name (Diagnosis or Prognosis)
  data_dir: "./data/raw"  # Custom data directory for non-PHMD datasets
  
  # Paper-compliant split strategy (prevents data leakage)
  # Split 1: 80% train, 20% test (test NEVER used in pretraining/finetuning)
  # Split 2: Within 80% train, split 90/10 for finetuning train/val
  # Pretraining: uses all 80% train (unlabeled)
  test_size: 0.2  # Test set size (20% as per paper)
  finetune_val_size: 0.1  # Validation size within train80 (10% of train80)
  random_state: 42  # Random seed for reproducibility
  
  # Preprocessing
  normalize: true  # Normalize signals
  signal_window: null  # Sliding window size (null = use full signal)
  overlap: 0  # Overlap between windows

# Evaluation Configuration
evaluation:
  metrics:
    diagnosis: ["accuracy", "precision", "recall", "f1"]
    prognosis: ["mse", "mae", "rmse", "score"]  # RUL score metric
  save_predictions: true
  save_dir: "results/"

# Logging and Checkpoints
logging:
  log_dir: "logs/"
  checkpoint_dir: "checkpoints/"
  save_every: 10  # Save checkpoint every N epochs
  log_every: 100  # Log metrics every N steps

# Hardware Configuration
hardware:
  device: "cuda"  # "cuda" or "cpu"
  num_workers: 4  # DataLoader workers
  pin_memory: true
