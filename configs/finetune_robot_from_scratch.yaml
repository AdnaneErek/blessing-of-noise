# Robot Dataset Fine-tuning Configuration - FROM SCRATCH
# Train RmGPT from scratch (no pretrained weights) on robot dataset
# The pretrained model was trained on vibration signals, which don't transfer to trajectory data

# Model Configuration
model:
  signal_dim: 9  # Use actual input channels (no projection needed)
  patch_length: 256
  tokenizer_stride: 256
  
  embed_dim: 512
  num_prompts: 10
  num_faults: 9  # 9 classes for robot dataset
  
  num_layers: 4
  num_heads: 8
  ff_dim: 2048
  dropout: 0.1
  improved_diagnosis_head: true  # Use improved (deeper) diagnosis head
  
  n_fft: 256
  wavelet: "db4"
  wavelet_levels: 4

# Training Configuration - FROM SCRATCH (higher LRs, no need to preserve pretrained features)
training:
  # Single learning rate for all parameters (no pretrained features to preserve)
  lr: 1.0e-4  # Higher LR since training from scratch
  head_lr: null  # Use same LR for all parameters
  weight_decay: 0.01
  warmup_steps: 100  # Shorter warmup for from-scratch training
  max_grad_norm: 1.0
  
  # Loss function improvements
  label_smoothing: 0.1  # Prevents overconfidence, improves generalization
  use_focal_loss: true  # Handles class imbalance better
  focal_alpha: 0.25  # Focal loss alpha (class weighting)
  focal_gamma: 2.0  # Focal loss gamma (focusing parameter)
  
  # Learning rate schedule
  lr_schedule: "constant"
  min_lr: 1.0e-6
  
  # Training schedule
  batch_size: 256
  accumulate_grad_batches: 1
  
  # Fine-tuning - Start with fewer epochs to test
  finetune_epochs: 100  # Start with 100 epochs
  prompt_learning_epochs: 5
  task_type: "diagnosis"

# Data Configuration - Robot Dataset
data:
  dataset_name: "ROBOT"  # Custom dataset name
  task_name: "diagnosis"
  data_dir: "data/raw/dataset"  # Path to the robot dataset
  normalize: true
  signal_window: 1000 # Robot data is 1000 timesteps
  overlap: 0 # No overlap for now
  test_size: 0.2
  finetune_val_size: 0.1
  random_state: 42
  
  # Noise augmentation for domain adaptation (simulation -> real)
  # Add noise to simulation training data to make model more robust to real-world data
  noise_augmentation:
    enabled: true  # Enable noise augmentation for training data
    std: 0.05  # Noise standard deviation (relative to normalized signal std=1)
    type: "gaussian"  # Noise type: "gaussian", "uniform", or "laplace"

# Logging and Checkpointing
logging:
  log_dir: "logs"
  checkpoint_dir: "checkpoints"
  save_every: 10 # Save checkpoint every 10 epochs

# Evaluation
evaluation:
  save_dir: "results"

# Hardware Configuration
hardware:
  device: "cuda"
  num_workers: 4
  pin_memory: true
